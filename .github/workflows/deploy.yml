name: Deploy to GitHub Pages

on:
 push:
   branches: [main]
 workflow_dispatch:

 permissions:
   contents: read
   pages: write
   id-token: write

   concurrency:
     group: pages
     cancel-in-progress: false

   jobs:
     build:
       runs-on: ubuntu-latest
       steps:
         - name: Checkout
           uses: actions/checkout@v4

         - name: Setup Node
           uses: actions/setup-node@v4
           with:
             node-version: 20
             cache: npm              # ← 用 npm 缓存

         - name: Install dependencies
           run: npm ci              # ← 比 npm install 快，且锁版本

         - name: Build with Astro
           run: npm run build       # ← 等价于 astro build

         - name: Upload artifact
           uses: actions/upload-pages-artifact@v3
           with:
             path: ./dist

     deploy:
       environment:
         name: github-pages
         url: ${{ steps.deployment.outputs.page_url }}
       runs-on: ubuntu-latest
       needs: build
       steps:
         - name: Deploy to GitHub Pages
           id: deployment
           uses: actions/deploy-pages@v4
